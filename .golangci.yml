version: "2"

linters:
  default: none
  enable:
    - bodyclose
    - decorder
    - errcheck
    - errorlint
    - gocognit
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - misspell
    - nakedret
    - revive
    - staticcheck
    - unconvert
    - unparam
  settings:
    decorder:
      dec-order:
        - const
        - var
        - type
        - func
      disable-dec-order-check: false
      disable-dec-num-check: false
      disable-init-func-first-check: false
    gocognit:
      min-complexity: 15
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/fascari/swiftbar-usdbrl
