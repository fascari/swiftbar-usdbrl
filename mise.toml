[tools]
go = "1.26.5"
golangci-lint = "2.15.0"
mockery = "2.53.8"
shellcheck = "0.10.0"

[env]
GOWORK = "off"
GOTOOLCHAIN = "local"
CGO_ENABLED = "0"

[tasks.build]
description = "Build the Go plugin"
run = 'go build -trimpath -buildvcs=false -ldflags "-s -w" -o bin/usdbrl ./cmd'

[tasks.lint]
description = "Lint and check Go formatting"
run = ["golangci-lint run", "golangci-lint fmt --diff"]

[tasks.fmt]
description = "Format Go code"
run = "golangci-lint fmt"

[tasks.tidy]
description = "Tidy Go module dependencies"
run = "go mod tidy"

[tasks.mocks]
description = "Generate Go mocks"
run = "go generate ./..."

[tasks.check]
description = "Check shell syntax and lint with ShellCheck"
run = [
  "bash -n install.sh",
  "bash -n test/smoke.sh",
  "bash -n test/installer.sh",
  "bash -n scripts/release.sh",
  "bash -n scripts/parity.sh",
  "bash -n scripts/build-converter.sh",
  "shellcheck -s bash install.sh test/smoke.sh test/installer.sh scripts/release.sh scripts/parity.sh scripts/build-converter.sh",
]

[tasks.test]
description = "Run Go unit tests and the smoke test"
run = ["go test ./...", {task = "smoke"}]

[tasks.smoke]
description = "Run the smoke test (needs network)"
# noinspection TomlUnresolvedReference
depends = ["build", "check"]
run = "bash test/smoke.sh"

[tasks.install]
description = "Install SwiftBar if needed and this working copy of the plugin (extra flags go to install.sh)"
# noinspection TomlUnresolvedReference
depends = ["build", "check", "build-converter"]
run = "bash install.sh --plugin bin/usdbrl --converter bin/Converter.app"

[tasks.build-converter]
description = "Build the SwiftUI payment converter for this Mac"
run = "mkdir -p bin && bash scripts/build-converter.sh"

[tasks.uninstall]
description = "Remove the plugin, its cache and settings (keeps SwiftBar)"
run = "bash install.sh --uninstall"

[tasks.release]
description = "Pin the checksum, tag and publish a GitHub release (mise run release vX.Y.Z)"
run = "bash scripts/release.sh"
